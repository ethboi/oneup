name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev clang cmake protobuf-compiler libudev-dev
      - run: cargo install --locked cargo-near --version 0.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight --compile
      - run: pnpm verify
      - run: pnpm test:economics --built
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:judge:ci
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          # Explicit allowlist: app snapshots and localnet/browser secrets are never uploaded.
          path: |
            .verification/verification.json
            .verification/economics.json
            .verification/judge-ci/**/summary.json
            .verification/judge-ci/**/sdk.json
            .verification/judge-ci/**/browser.json
            .verification/judge-ci/**/prepared-fixture.json
          include-hidden-files: true
