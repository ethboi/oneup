[workspace]
resolver = "2"
members = ["math", "house", "mock-usdc", "mock-oracle", "extra-life", "tests"]

[workspace.dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"
oneup-math = { path = "math" }
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
