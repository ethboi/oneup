[lib]
path = "lib.rs"

[package]
name = "oneup-integration"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
near-workspaces = { version = "0.23.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
near-sdk = { workspace = true, features = ["unit-testing"] }
openssl = { version = "0.10", features = ["vendored"] }
